name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        env:
          # 仓库 Variables 可覆盖；默认对接 Render 服务名 gics-demo-api
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://gics-demo-api.onrender.com/api' }}
          VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL || 'https://gics-demo-api.onrender.com' }}
          VITE_BASE_PATH: /GICS_demo/
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
