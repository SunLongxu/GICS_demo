# Render.com 一键部署后端 API（512MB 免费实例：轻量模式，不安装 PyTorch）
# 前端 GitHub Pages 的 VITE_API_BASE_URL 需指向该服务的 URL + /api

services:
  - type: web
    name: gics-demo-api
    runtime: python
    rootDir: backend/ICSGNN
    plan: free
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r requirements-render.txt
    startCommand: python run_api.py
    healthCheckPath: /test
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_DEBUG
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: GICS_LITE_MODE
        value: "true"
      - key: SKIP_STARTUP_INIT
        value: "true"
