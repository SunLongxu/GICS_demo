# Render.com 一键部署后端 API
# 在 Render Dashboard 连接本仓库后，将自动创建 Web Service
# 前端 GitHub Pages 的 VITE_API_BASE_URL 需指向该服务的 URL + /api

services:
  - type: web
    name: gics-demo-api
    runtime: python
    rootDir: backend/ICSGNN
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run_api.py
    healthCheckPath: /test
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FLASK_DEBUG
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
